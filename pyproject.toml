[project]
name = "neted"
version = "0.1.0"
description = "Network Ed: switch Windows network adapters between saved static IP/DNS profiles and DHCP from a tray app."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyqt6>=6.11.0",
    "qtawesome>=1.4.2",
]

[dependency-groups]
dev = [
    "auto-py-to-exe>=2.50.1",
    "pyinstaller>=6.22.3",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded PowerShell scripts keep their natural line length.
"src/network.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
